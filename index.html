<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ana Belén Pérez de Haro — Marketing digital &amp; contenido audiovisual</title>
<meta name="description" content="Portfolio de Ana Belén Pérez de Haro: marketing digital, ecommerce y producción audiovisual en Almería.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Tokens
   ========================================================= */
:root {
  --olive-deep:   #3E4A22;
  --olive-deep-2: #4B5A29;
  --olive-mid:    #6E8033;
  --olive-bright: #A7BB63;
  --sand:         #F5F1E1;
  --paper:        #FFFDF6;
  --clay:         #C1642F;
  --clay-soft:    #D98A57;
  --ink:          #262B1C;
  --ink-soft:     #565C48;
  --line:         #DFD9C2;
  --line-dark:    rgba(245,241,225,0.22);

  --font-display: 'Bricolage Grotesque', 'Segoe UI', sans-serif;
  --font-body:    'Inter', 'Segoe UI', sans-serif;

  --wrap: 1100px;
  --radius: 4px;
  --ease: cubic-bezier(.22,.68,.32,1);
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  .reveal, .reveal-big { opacity: 1 !important; transform: none !important; }
  [data-speed] { transform: none !important; }
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 84px;
}

body {
  margin: 0;
  background: var(--sand);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.wrap {
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 0 28px;
  position: relative;
}

h1, h2, h3 {
  font-family: var(--font-display);
  color: var(--olive-deep);
  line-height: 1.1;
  margin: 0;
}

h2 { font-size: 2.1rem; font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 600; }

p { margin: 0 0 0.9em; max-width: 62ch; color: var(--ink-soft); }

a { color: inherit; }

:focus-visible {
  outline: 2px solid var(--clay);
  outline-offset: 3px;
}

.sprig {
  width: 90px;
  height: 27px;
  color: var(--olive-mid);
}
.sprig-small { width: 56px; height: 17px; margin-bottom: 6px; }
.sprig-hero { width: 130px; height: 39px; margin-bottom: 18px; color: var(--olive-bright); }

/* =========================================================
   Progress bar
   ========================================================= */
.progress-bar {
  position: fixed;
  top: 0; left: 0;
  height: 3px;
  width: 0%;
  background: var(--clay);
  z-index: 200;
  transition: width 0.12s linear;
}

/* =========================================================
   Header / nav
   ========================================================= */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--olive-deep);
  box-shadow: 0 0 0 rgba(0,0,0,0);
  transition: box-shadow 0.3s var(--ease);
}
.site-header.is-scrolled {
  box-shadow: 0 6px 24px rgba(20,20,10,0.22);
}

.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 68px;
}

.logo {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.2rem;
  color: var(--sand);
  text-decoration: none;
}

.site-nav {
  display: flex;
  align-items: center;
  gap: 28px;
}

.nav-link {
  position: relative;
  color: var(--sand);
  text-decoration: none;
  font-size: 0.95rem;
  opacity: 0.85;
  padding-bottom: 4px;
  transition: opacity 0.15s ease;
}
.nav-link::after {
  content: '';
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 0%;
  height: 2px;
  background: var(--olive-bright);
  transition: width 0.25s var(--ease), left 0.25s var(--ease);
}
.nav-link:hover { opacity: 1; }
.nav-link:hover::after { width: 100%; left: 0%; }

.nav-cv {
  color: var(--olive-deep);
  background: var(--sand);
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: var(--radius);
  transition: background 0.2s ease, transform 0.2s var(--ease), box-shadow 0.2s ease;
}
.nav-cv:hover { background: var(--paper); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.18); }

.nav-toggle {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  width: 40px;
  height: 40px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}
.nav-toggle span {
  display: block;
  height: 2px;
  width: 100%;
  background: var(--sand);
  transition: transform 0.25s var(--ease), opacity 0.2s ease;
}
.nav-toggle.is-active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-toggle.is-active span:nth-child(2) { opacity: 0; }
.nav-toggle.is-active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* =========================================================
   Decorative parallax layer (blobs)
   ========================================================= */
.hero-bg {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0.5;
  will-change: transform;
}
.blob-1 { width: 380px; height: 380px; background: var(--olive-mid); top: -120px; right: -80px; }
.blob-2 { width: 280px; height: 280px; background: var(--clay-soft); bottom: -100px; left: -60px; opacity: 0.35; }
.blob-3 { width: 420px; height: 420px; background: var(--olive-bright); top: 20%; right: -160px; opacity: 0.18; }

.sprig-hero-bg {
  position: absolute;
  width: 340px;
  height: 102px;
  right: 6%;
  bottom: 12%;
  color: var(--olive-mid);
  opacity: 0.18;
  will-change: transform;
}

/* =========================================================
   Hero
   ========================================================= */
.hero {
  position: relative;
  padding: 88px 0 96px;
  background: var(--olive-deep);
  color: var(--sand);
  overflow: hidden;
}

.hero-inner {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1.3fr 0.7fr;
  gap: 56px;
  align-items: center;
}

.hero-text > * {
  opacity: 0;
  transform: translateY(18px);
  animation: fadeUp 0.7s var(--ease) forwards;
}
.hero-text .sprig-hero { animation-delay: 0.05s; }
.hero-text h1 { animation-delay: 0.15s; }
.hero-text .role { animation-delay: 0.32s; }
.hero-text .bio { animation-delay: 0.46s; }
.hero-text .hero-actions { animation-delay: 0.6s; }

.hero-text h1 {
  font-size: clamp(2.4rem, 5vw, 3.4rem);
  font-weight: 700;
  color: var(--sand);
}

.role {
  font-size: 1.2rem;
  color: var(--olive-bright);
  font-weight: 500;
  margin-top: 14px;
}

.bio { margin-top: 18px; color: rgba(245,241,225,0.78); }

.hero-actions {
  display: flex;
  gap: 14px;
  margin-top: 30px;
  flex-wrap: wrap;
}

.btn {
  position: relative;
  display: inline-block;
  overflow: hidden;
  text-decoration: none;
  font-size: 0.95rem;
  font-weight: 600;
  padding: 12px 24px;
  border-radius: var(--radius);
  transition: transform 0.25s var(--ease), background 0.2s ease, border-color 0.2s ease, box-shadow 0.25s ease;
}
.btn::before {
  content: '';
  position: absolute;
  top: 0; left: -130%;
  width: 60%; height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
  transform: skewX(-20deg);
  transition: left 0.55s ease;
}
.btn:hover::before { left: 130%; }
.btn:hover { transform: translateY(-3px); }

.btn-primary {
  background: var(--olive-bright);
  color: var(--olive-deep);
}
.btn-primary:hover { background: var(--sand); box-shadow: 0 10px 24px rgba(0,0,0,0.25); }

.btn-ghost {
  background: transparent;
  color: var(--sand);
  border: 1.5px solid rgba(245,241,225,0.6);
}
.btn-ghost:hover { background: rgba(245,241,225,0.12); border-color: var(--sand); }

/* botones sobre fondos claros */
.section-light .btn-ghost { color: var(--olive-deep); border-color: var(--olive-deep); }
.section-light .btn-ghost:hover { background: var(--olive-deep); color: var(--paper); }

.hero-photo {
  position: relative;
  display: flex;
  justify-content: center;
  z-index: 1;
  opacity: 0;
  transform: translateY(18px);
  animation: fadeUp 0.7s var(--ease) forwards;
  animation-delay: 0.3s;
}

.photo-glow {
  position: absolute;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(167,187,99,0.55), transparent 70%);
  animation: floatGlow 6s ease-in-out infinite;
}

.photo-placeholder {
  position: relative;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: var(--olive-mid);
  color: var(--paper);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 3.2rem;
  font-weight: 700;
  border: 6px solid var(--olive-deep-2);
  box-shadow: 0 0 0 1.5px rgba(245,241,225,0.4);
  transition: transform 0.35s var(--ease);
}
.photo-placeholder:hover { transform: rotate(-4deg) scale(1.05); }

.scroll-cue {
  position: absolute;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  width: 22px;
  height: 36px;
  border: 2px solid rgba(245,241,225,0.5);
  border-radius: 12px;
  z-index: 1;
}
.scroll-cue span {
  position: absolute;
  top: 6px;
  left: 50%;
  width: 4px;
  height: 8px;
  background: var(--olive-bright);
  border-radius: 2px;
  transform: translateX(-50%);
  animation: bounceCue 1.8s ease-in-out infinite;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes floatGlow {
  0%, 100% { transform: scale(1); opacity: 0.55; }
  50%      { transform: scale(1.12); opacity: 0.85; }
}
@keyframes bounceCue {
  0%, 100% { opacity: 0.3; top: 6px; }
  50%      { opacity: 1; top: 16px; }
}

/* =========================================================
   Dividers (transiciones grandes entre secciones)
   ========================================================= */
.divider {
  position: relative;
  height: 90px;
  overflow: hidden;
  line-height: 0;
}
.divider-shape { width: 100%; height: 100%; display: block; }

.divider-dark-to-light { background: var(--olive-deep); }
.divider-dark-to-light .divider-shape { color: var(--sand); }

.divider-light-to-dark { background: var(--sand); }
.divider-light-to-dark .divider-shape { color: var(--olive-deep); }

/* =========================================================
   Sections
   ========================================================= */
.section { position: relative; padding: 88px 0; overflow: hidden; }

.section-light { background: var(--sand); color: var(--ink); }

.section-dark {
  color: var(--sand);
  background: linear-gradient(120deg, var(--olive-deep) 0%, var(--olive-deep-2) 45%, var(--olive-deep) 100%);
  background-size: 220% 220%;
  animation: driftGradient 22s ease-in-out infinite;
}
.section-dark h2, .section-dark h3 { color: var(--sand); }
.section-dark p { color: rgba(245,241,225,0.78); }
.section-dark .sprig { color: var(--olive-bright); }

@keyframes driftGradient {
  0%, 100% { background-position: 0% 50%; }
  50%      { background-position: 100% 50%; }
}

.section-heading { margin-bottom: 44px; }

/* Reveal on scroll */
.reveal-big {
  opacity: 0;
  transform: translateY(26px) scale(0.97);
  transition: opacity 0.8s var(--ease), transform 0.8s var(--ease);
}
.reveal-big.in-view { opacity: 1; transform: translateY(0) scale(1); }

.reveal {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
}
.reveal.in-view { opacity: 1; transform: translateY(0); }

.timeline-item:nth-child(1) { transition-delay: 0s; }
.timeline-item:nth-child(2) { transition-delay: 0.09s; }
.timeline-item:nth-child(3) { transition-delay: 0.18s; }
.timeline-item:nth-child(4) { transition-delay: 0.27s; }

.skill-group:nth-child(1) { transition-delay: 0s; }
.skill-group:nth-child(2) { transition-delay: 0.08s; }
.skill-group:nth-child(3) { transition-delay: 0.16s; }
.skill-group:nth-child(4) { transition-delay: 0.24s; }

/* Timeline (Formación / Experiencia) */
.timeline {
  position: relative;
  z-index: 1;
  list-style: none;
  margin: 0;
  padding: 0 0 0 24px;
  border-left: 2px solid var(--line);
}
.section-dark .timeline { border-left-color: var(--line-dark); }

.timeline-item {
  position: relative;
  padding: 0 0 40px 32px;
  transition: opacity 0.6s var(--ease), transform 0.4s var(--ease);
}
.timeline-item:last-child { padding-bottom: 0; }
.timeline-item:hover .timeline-content { transform: translateX(8px); }
.timeline-item:hover .timeline-dot { transform: scale(1.5); }

.timeline-dot {
  position: absolute;
  left: -37px;
  top: 4px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--clay);
  border: 3px solid var(--sand);
  transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
}
.section-dark .timeline-dot { border-color: var(--olive-deep); box-shadow: 0 0 0 0 rgba(193,100,47,0); }
.timeline-item:hover .timeline-dot { box-shadow: 0 0 0 6px rgba(193,100,47,0.2); }

.timeline-content { transition: transform 0.3s var(--ease); }

.timeline-date {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--olive-mid);
  margin-bottom: 6px;
}
.section-dark .timeline-date { color: var(--olive-bright); }

.timeline-content h3 { margin-bottom: 4px; }
.timeline-content p { margin-bottom: 0; }
.role-label { color: var(--olive-deep); font-weight: 500; margin-bottom: 4px !important; }
.section-dark .role-label {
